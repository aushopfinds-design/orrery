name: Validate English Saju report

on:
  push:
    branches:
      - feature/english-saju-report-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check all tests
        run: bunx vitest run
      - name: Check TypeScript and production build
        run: bun run build
