name: Verify calculation engine

on:
  push:
    branches:
      - verification/saju-2026-10-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run all tests
        run: bunx vitest run
      - name: Check production build
        run: bun run build
