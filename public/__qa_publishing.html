<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publishing layout check</title><style>body{margin:15px;background:#d2d7dc;font:15px Arial}header{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}label{display:flex;gap:8px;align-items:center}select{min-height:40px}iframe{display:block;border:1px solid #6d7881;background:white;height:800px}</style></head><body><header><label>Page<select id="page"><option value="/">Interactive home</option><option value="/samples/">Sample library</option><option value="/about/">About</option><option value="/privacy/">Privacy notice</option><option value="/use-and-limitations/">Use and limitations</option><option value="/reading-guide/">Reading guide</option><option value="/samples/year-ahead/">Year Ahead</option><option value="/samples/career-money/">Career and Money</option><option value="/samples/love-compatibility/">Love Compatibility</option><option value="/samples/complete-life-reading/">Complete Life Reading</option><option value="/samples/business-entrepreneurship/">Business</option><option value="/samples/everyday-balance/">Everyday Balance</option></select></label><label>Width<select id="width"><option>390</option><option>360</option><option>430</option><option>1100</option></select></label></header><iframe id="phone" title="Mobile page check" src="/samples/" width="390"></iframe><script>const f=document.getElementById('phone');document.getElementById('page').addEventListener('change',e=>f.src=e.target.value);document.getElementById('width').addEventListener('change',e=>f.width=e.target.value);</script></body></html>
