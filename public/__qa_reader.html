<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reader layout review</title>
<style>body{margin:0;padding:14px;background:#e7e5e0;font:14px system-ui;color:#243648}header{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}label{display:flex;align-items:center;gap:8px}select{padding:8px;border:1px solid #a99a80;border-radius:5px;background:white}iframe{display:block;margin:auto;border:1px solid #a99a80;background:#fff;width:390px;height:844px;max-width:100%}textarea{display:block;margin:12px auto;width:390px;min-height:55px;max-width:100%}</style>
<header><label>Phone width<select id="width"><option>360</option><option selected>390</option><option>430</option></select></label><label>Page<select id="page">
<option value="/#career-money-sample-start">Career sample</option><option value="/#business-reading-sample-start">Business sample</option><option value="/#love-compatibility-sample-start">Relationship sample</option><option value="/#year-ahead-sample-start">Year sample</option><option value="/#everyday-balance-sample-start">Balance sample</option><option value="/#sample-report-start">Life sample</option><option value="/#complete-bundle-sample-life-report-start">Bundle sample</option>
<option value="/#my-report-career">Career preview</option><option value="/#my-report-business">Business preview</option><option value="/#my-report-compatibility">Relationship preview</option><option value="/#my-report-year">Year preview</option><option value="/#my-report-wellbeing">Balance preview</option><option value="/#my-report-complete">Life preview</option><option value="/#my-report-bundle">Bundle preview</option>
</select></label></header><iframe id="phone" title="Phone viewport" src="/#career-money-sample-start"></iframe><textarea aria-label="Paste check" placeholder="Clipboard check"></textarea>
<script>const width=document.getElementById('width'),page=document.getElementById('page'),phone=document.getElementById('phone');width.onchange=()=>phone.style.width=width.value+'px';page.onchange=()=>phone.src=page.value;</script>
</html>
