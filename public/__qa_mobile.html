<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile layout check</title><style>body{margin:0;background:#d7dfe4;color:#132d42;font:14px system-ui}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 22px;background:#fff}label{display:flex;gap:8px;align-items:center}select,button{padding:7px}main{display:flex;justify-content:center;padding:18px}iframe{display:block;border:0;background:#fff;box-shadow:0 5px 30px #10253644}small{display:block}</style><header><strong>Actual page at phone width</strong><label>Phone width<select id="width"><option value="360">360 px</option><option selected value="390">390 px</option><option value="430">430 px</option></select></label><label>Page<select id="page"><option value="#reports">Products</option><option value="#sample-report">Complete Life Reading</option><option value="#love-compatibility-sample">Love Compatibility</option><option value="#year-ahead-sample">Year Ahead</option><option value="#career-money-sample">Career &amp; Money</option><option value="#business-reading-sample">Business</option><option value="#everyday-balance-sample">Everyday Balance</option><option value="#complete-bundle-sample">Bundle</option><option value="#my-report">Personal preview</option><option value="#home">Home</option></select></label><label>Paste check<textarea aria-label="Paste check" rows="1" style="width:90px;height:26px"></textarea></label><small>Responsive viewport, 844 px high. No physical-device emulation.</small></header><main><iframe id="phone" title="Phone viewport" src="/#reports" width="390" height="844"></iframe></main><script>const frame=document.querySelector('#phone');document.querySelector('#width').addEventListener('change',e=>frame.width=e.target.value);document.querySelector('#page').addEventListener('change',e=>frame.src='/'+e.target.value);</script></html>
