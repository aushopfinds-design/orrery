<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Fate Key · Preview review</title><style>
body{margin:0;padding:18px;background:#e8e9ec;font:14px system-ui;color:#233c50}header{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px;border:1px solid #a8a8a8;border-radius:5px}iframe{display:block;height:844px;width:390px;margin:0 auto;border:1px solid #aeb5bc;border-radius:16px;background:white;box-shadow:0 12px 40px #10202e33}textarea{display:block;width:300px;height:45px}h1{font:600 15px system-ui;margin:0}
</style></head><body><header><h1>The Fate Key · mobile review</h1><label>Phone width<select id="width"><option>360</option><option selected>390</option><option>430</option></select></label><label>Page<select id="page"><option value="#reports">Our Reports</option><option value="#my-report-year">Year Ahead</option><option value="#my-report-career">Career &amp; Money</option><option value="#my-report-compatibility">Love Compatibility</option><option value="#my-report">Complete Life Reading</option><option value="#my-report-business">Business &amp; Entrepreneurship</option><option value="#my-report-wellbeing">Everyday Balance</option><option value="#my-report-bundle">Complete Bundle</option></select></label><label>Paste check<textarea id="paste"></textarea></label></header><iframe id="phone" title="Phone viewport" src="/#reports"></iframe><script>

</script></body></html>
